<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 500" width="1050" height="500" fill="none">
  <title>HypoMap-Bench: 3,178 tasks are built from 722 real studies, a model audits or revises a hypothesis map and answers with a structured operation, and answers are scored by rule checks and an LLM judge that agrees with experts</title>
  <defs>
    <style>
      .s{font-family:Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
      .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    </style>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#4c4f69" flood-opacity=".07"/>
    </filter>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M1.5 1.5 L8 5 L1.5 8.5" fill="none" stroke="#1e66f5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M1.5 1.5 L8 5 L1.5 8.5" fill="none" stroke="#acb0be" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1050" height="500" fill="#eff1f5"/>

  <g class="m" font-size="13" letter-spacing="1.5" fill="#8c8fa1">
    <text x="40" y="56"><tspan fill="#1e66f5">01</tspan> BUILD</text>
    <text x="380" y="56"><tspan fill="#1e66f5">02</tspan> SOLVE</text>
    <text x="720" y="56"><tspan fill="#1e66f5">03</tspan> SCORE</text>
  </g>

  <g filter="url(#sh)" fill="#fff" stroke="#e6e9ef">
    <rect x="40" y="76" width="290" height="334" rx="14"/>
    <rect x="380" y="76" width="290" height="334" rx="14"/>
    <rect x="720" y="76" width="290" height="334" rx="14"/>
  </g>
  <g stroke="#1e66f5" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ar)">
    <path d="M338 243 H372"/>
    <path d="M678 243 H712"/>
  </g>

  <!-- 01 build -->
  <g fill="#fff" stroke="#acb0be" stroke-width="1.2">
    <rect x="68" y="100" width="22" height="28" rx="3"/>
    <rect x="64" y="104" width="22" height="28" rx="3"/>
    <rect x="60" y="108" width="22" height="28" rx="3"/>
  </g>
  <path d="M65 117 H77 M65 122 H77 M65 127 H73" stroke="#ccd0da" stroke-width="1.2" stroke-linecap="round"/>
  <text class="s" x="104" y="117" font-size="15" font-weight="600" fill="#4c4f69">722 studies</text>
  <text class="m" x="104" y="135" font-size="12" fill="#8c8fa1">supply the content</text>

  <path d="M75 146 V164" stroke="#acb0be" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ag)"/>

  <g stroke="#acb0be" stroke-width="1.2">
    <path d="M75 178 L66 190 M75 178 L84 190 M66 190 L61 202 M66 190 L71 202 M84 190 L79 202 M84 190 L89 202"/>
  </g>
  <circle cx="75" cy="178" r="4" fill="#1e66f5"/>
  <g fill="#40a02b"><circle cx="66" cy="190" r="3.5"/><circle cx="84" cy="190" r="3.5"/></g>
  <g fill="#fe640b"><circle cx="61" cy="202" r="3"/><circle cx="71" cy="202" r="3"/><circle cx="79" cy="202" r="3"/><circle cx="89" cy="202" r="3"/></g>
  <text class="s" x="104" y="189" font-size="15" font-weight="600" fill="#4c4f69">Hypothesis maps</text>
  <text class="m" x="104" y="207" font-size="12" fill="#8c8fa1">cite their sources</text>

  <path d="M75 218 V236" stroke="#acb0be" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ag)"/>

  <text class="m" x="60" y="262" font-size="12" fill="#8c8fa1">tasks pass quality control</text>
  <g fill="#eff1f5" stroke="#e6e9ef">
    <rect x="60" y="274" width="118" height="26" rx="13"/>
    <rect x="192" y="274" width="118" height="26" rx="13"/>
    <rect x="60" y="308" width="118" height="26" rx="13"/>
    <rect x="192" y="308" width="118" height="26" rx="13"/>
  </g>
  <g class="s" font-size="12.5" fill="#4c4f69" text-anchor="middle">
    <text x="119" y="291.5">source fidelity</text>
    <text x="251" y="291.5">no leaks</text>
    <text x="119" y="325.5">answerable</text>
    <text x="251" y="325.5">blind solve</text>
  </g>

  <rect x="60" y="342" width="250" height="44" rx="10" fill="#e9f0fe"/>
  <text class="m" x="78" y="369" font-size="13" fill="#1e66f5">→ 3,178 tasks</text>

  <!-- 02 solve -->
  <text class="m" x="400" y="106" font-size="12" fill="#8c8fa1">one task</text>
  <rect x="400" y="118" width="100" height="82" rx="10" fill="#eff1f5" stroke="#e6e9ef"/>
  <g stroke="#acb0be" stroke-width="1.2">
    <path d="M450 134 L424 160 M450 134 L450 160 M450 134 L476 160 M424 160 L414 186 M424 160 L434 186 M476 160 L466 186 M476 160 L486 186"/>
  </g>
  <circle cx="450" cy="134" r="6" fill="#1e66f5"/>
  <g fill="#40a02b"><circle cx="424" cy="160" r="5"/><circle cx="450" cy="160" r="5"/><circle cx="476" cy="160" r="5"/></g>
  <g fill="#fe640b"><circle cx="414" cy="186" r="4.5"/><circle cx="434" cy="186" r="4.5"/><circle cx="466" cy="186" r="4.5"/><circle cx="486" cy="186" r="4.5"/></g>
  <circle cx="476" cy="160" r="10" stroke="#1e66f5" stroke-width="1.6"/>

  <path d="M524 128 H638 a12 12 0 0 1 12 12 V178 a12 12 0 0 1 -12 12 H524 a12 12 0 0 1 -12 -12 V164 L503 159 L512 154 V140 a12 12 0 0 1 12 -12 Z" fill="#fff" stroke="#ccd0da"/>
  <text class="s" font-size="13.5" fill="#4c4f69"><tspan x="528" y="155">Does this aspect</tspan><tspan x="528" y="174">need refining?</tspan></text>

  <path d="M525 208 V226" stroke="#acb0be" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ag)"/>

  <rect x="400.75" y="234.75" width="248.5" height="40.5" rx="10" fill="#fff" stroke="#1e66f5" stroke-width="1.5"/>
  <text class="s" x="525" y="260" font-size="14.5" fill="#4c4f69" text-anchor="middle"><tspan font-weight="600">Model</tspan> reasons, then answers</text>

  <path d="M525 284 V302" stroke="#acb0be" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ag)"/>

  <rect x="400" y="310" width="250" height="76" rx="10" fill="#eff1f5" stroke="#e6e9ef"/>
  <g class="m" font-size="13">
    <text x="418" y="340"><tspan fill="#8c8fa1">{</tspan> <tspan fill="#1e66f5">"operation"</tspan><tspan fill="#8c8fa1">:</tspan></text>
    <text x="438" y="364"><tspan fill="#2d701e">"REFINE_ASPECT"</tspan> <tspan fill="#8c8fa1">}</tspan></text>
  </g>

  <!-- 03 score -->
  <text class="s" x="740" y="110" font-size="16" font-weight="600" fill="#4c4f69">Five scoring criteria</text>
  <text class="m" x="740" y="130" font-size="12" fill="#8c8fa1">rule checks + LLM judge</text>
  <path d="M740 146 H990" stroke="#eff1f5"/>

  <text class="m" x="740" y="172" font-size="12" fill="#8c8fa1">by code</text>
  <g fill="#fff" stroke="#ccd0da">
    <rect x="740.5" y="182.5" width="77" height="27" rx="13.5"/>
    <rect x="827.5" y="182.5" width="77" height="27" rx="13.5"/>
    <rect x="914.5" y="182.5" width="65" height="27" rx="13.5"/>
  </g>
  <text class="m" x="740" y="236" font-size="12" fill="#8c8fa1">by LLM judge</text>
  <rect x="740.5" y="246.5" width="101" height="27" rx="13.5" fill="#fff" stroke="#ccd0da"/>
  <rect x="851.5" y="246.5" width="101" height="27" rx="13.5" fill="#e9f0fe" stroke="#1e66f5"/>
  <g class="s" font-size="13" fill="#4c4f69" text-anchor="middle">
    <text x="779" y="200.5">Validity</text>
    <text x="866" y="200.5">Decision</text>
    <text x="947" y="200.5">Scope</text>
    <text x="791" y="264.5">Correctness</text>
    <text x="902" y="264.5" fill="#1e66f5">Map quality</text>
  </g>

  <path d="M740 290 H990" stroke="#eff1f5"/>
  <text class="m" x="740" y="314" font-size="12" fill="#8c8fa1">map quality vs. experts, ρ</text>
  <g class="s" font-size="13" fill="#4c4f69">
    <text x="740" y="341">LLM judge</text>
    <text x="740" y="369">Between experts</text>
  </g>
  <rect x="848" y="331" width="91" height="12" rx="4" fill="#1e66f5"/>
  <rect x="848" y="359" width="97" height="12" rx="4" fill="#acb0be"/>
  <g class="m" font-size="13" fill="#4c4f69">
    <text x="947" y="341.5">.83</text>
    <text x="953" y="369.5">.88</text>
  </g>

  <g class="s" font-size="15" fill="#5c5f77" text-anchor="middle">
    <text x="185" y="446">Tasks built from real studies</text>
    <text x="525" y="446">Models audit, repair, or extend a map</text>
    <text x="865" y="446">Code and an LLM judge score answers</text>
  </g>
</svg>
