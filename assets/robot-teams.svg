<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 500" width="1050" height="500" fill="none">
  <title>A silent reference failure: a scout sees one red mug, the handoff drops its location, and the arm picks up a different red mug</title>
  <defs>
    <style>
      .s{font-family:Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
      .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    </style>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#4c4f69" flood-opacity=".07"/>
    </filter>
    <pattern id="floor" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" stroke="#eff1f5"/>
    </pattern>
    <g id="mug">
      <path d="M8 -4 h4.5 a4 4 0 0 1 0 8 H8" stroke="#d20f39" stroke-width="2.6"/>
      <circle r="10" fill="#d20f39" stroke="#fff" stroke-width="2"/>
    </g>
    <g id="bot">
      <circle r="15" fill="#4c4f69"/>
      <circle r="15" stroke="#fff" stroke-opacity=".18" stroke-width="3"/>
      <path d="M0 -9 L5 -1 H-5 Z" fill="#fff"/>
    </g>
  </defs>

  <rect width="1050" height="500" fill="#eff1f5"/>

  <g class="m" font-size="13" letter-spacing="1.5" fill="#8c8fa1">
    <text x="40" y="56">SIMULATED TESTBED</text>
    <text x="604" y="56">REFERENCE TRACE</text>
  </g>

  <!-- map -->
  <rect x="40" y="76" width="520" height="334" rx="14" fill="#fff" stroke="#e6e9ef" filter="url(#sh)"/>
  <rect x="52" y="88" width="496" height="310" rx="8" fill="url(#floor)"/>

  <rect x="86" y="116" width="150" height="78" rx="8" fill="#eff1f5" stroke="#dce0e8"/>
  <text class="m" x="98" y="134" font-size="11" fill="#8c8fa1">table</text>
  <rect x="112" y="150" width="10" height="24" rx="3" fill="#40a02b"/>
  <rect x="376" y="300" width="150" height="64" rx="8" fill="#eff1f5" stroke="#dce0e8"/>
  <text class="m" x="388" y="318" font-size="11" fill="#8c8fa1">shelf</text>
  <rect x="402" y="328" width="18" height="18" rx="3" fill="#7287fd"/>

  <!-- scout cones -->
  <path d="M200 292 L146 170 L254 170 Z" fill="#1e66f5" fill-opacity=".07" stroke="#1e66f5" stroke-opacity=".28"/>
  <path d="M330 196 L438 150 L438 242 Z" fill="#4c4f69" fill-opacity=".035"/>

  <!-- mugs -->
  <use href="#mug" x="196" y="160"/>
  <circle cx="198" cy="160" r="19" stroke="#1e66f5" stroke-width="1.6" stroke-dasharray="3 3"/>
  <text class="m" x="198" y="214" font-size="11.5" fill="#1e66f5" text-anchor="middle">obj_17 · seen</text>
  <use href="#mug" x="470" y="334"/>
  <circle cx="472" cy="334" r="19" stroke="#fe640b" stroke-width="1.6"/>
  <text class="m" x="472" y="388" font-size="11.5" fill="#fe640b" text-anchor="middle">obj_23 · picked</text>

  <!-- robots -->
  <use href="#bot" x="200" y="292"/>
  <text class="m" x="224" y="296" font-size="11.5" fill="#4c4f69">Scout 1</text>
  <g transform="translate(330 196) rotate(90)"><use href="#bot"/></g>
  <text class="m" x="330" y="230" font-size="11.5" fill="#4c4f69" text-anchor="middle">Scout 2</text>
  <g stroke="#4c4f69" stroke-linecap="round" stroke-linejoin="round">
    <path d="M500 168 L522 236" stroke-width="9"/>
    <path d="M522 236 L482 312" stroke-width="7"/>
    <path d="M474 312 h16 M476 312 v8 M488 312 v8" stroke-width="3"/>
  </g>
  <circle cx="500" cy="168" r="15" fill="#4c4f69"/>
  <circle cx="522" cy="236" r="5" fill="#fff" stroke="#4c4f69" stroke-width="2"/>
  <text class="m" x="500" y="140" font-size="11.5" fill="#4c4f69" text-anchor="middle">Arm</text>

  <!-- trace -->
  <path d="M586 111 V375" stroke="#dce0e8" stroke-width="2"/>
  <circle cx="586" cy="111" r="6" fill="#40a02b" stroke="#eff1f5" stroke-width="3"/>
  <circle cx="586" cy="199" r="6" fill="#fe640b" stroke="#eff1f5" stroke-width="3"/>
  <circle cx="586" cy="287" r="6" fill="#acb0be" stroke="#eff1f5" stroke-width="3"/>
  <circle cx="586" cy="375" r="6" fill="#fe640b" stroke="#eff1f5" stroke-width="3"/>

  <g fill="#fff" stroke="#e6e9ef" filter="url(#sh)">
    <rect x="604" y="76" width="406" height="70" rx="12"/>
    <rect x="604" y="164" width="406" height="70" rx="12"/>
    <rect x="604" y="252" width="406" height="70" rx="12"/>
    <rect x="604" y="340" width="406" height="70" rx="12"/>
  </g>
  <g class="m" font-size="12" fill="#8c8fa1">
    <text x="624" y="104">Scout 1 · perception</text>
    <text x="624" y="192">Scout 1 → Coordinator</text>
    <text x="624" y="280">Coordinator → Arm</text>
    <text x="624" y="368">Arm · grounding</text>
  </g>
  <g class="s" font-size="15.5" fill="#4c4f69">
    <text x="624" y="129">obj_17 = red mug, <tspan fill="#1e66f5">left table</tspan></text>
    <text x="624" y="217">“Found the red mug.”</text>
    <text x="624" y="305">“Pick up the red mug.”</text>
    <text x="624" y="393">resolves to obj_23 <tspan fill="#fe640b">✕</tspan></text>
  </g>
  <g class="m" font-size="11.5" text-anchor="middle">
    <rect x="894" y="90" width="100" height="24" rx="12" fill="#e8f4e6"/>
    <text x="944" y="106" fill="#2d701e">evidence in</text>
    <rect x="856" y="178" width="138" height="24" rx="12" fill="#fff0e7"/>
    <text x="925" y="194" fill="#b74808">location dropped</text>
    <rect x="902" y="266" width="92" height="24" rx="12" fill="#eff1f5"/>
    <text x="948" y="282" fill="#5c5f77">ambiguous</text>
    <rect x="884" y="354" width="110" height="24" rx="12" fill="#fff0e7"/>
    <text x="939" y="370" fill="#b74808">wrong object</text>
  </g>

  <text class="s" x="525" y="446" font-size="15" fill="#5c5f77" text-anchor="middle">The location is lost in the handoff, so the arm picks up a different mug.</text>
</svg>
