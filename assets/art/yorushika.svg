<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="800" height="500">
  <title>A quiet summer night by the sea: a telephone pole, power lines, fireflies, and someone sitting on the embankment</title>
  <style>
    .ff{animation:ff 7s ease-in-out infinite}
    .ff:nth-of-type(2n){animation-duration:9s;animation-delay:-3s}
    .ff:nth-of-type(3n){animation-duration:6s;animation-delay:-1.5s}
    @keyframes ff{0%,100%{transform:translate(0,0);opacity:.95}40%{transform:translate(4px,-6px);opacity:.35}70%{transform:translate(-3px,-2px);opacity:.8}}
    @media (prefers-reduced-motion:reduce){.ff{animation:none}}
  </style>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1230"/>
      <stop offset=".5" stop-color="#15244a"/>
      <stop offset=".82" stop-color="#2c416e"/>
      <stop offset="1" stop-color="#7d7896"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#25365f"/>
      <stop offset="1" stop-color="#090d1c"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#f3b08c" stop-opacity=".3"/>
      <stop offset="1" stop-color="#f3b08c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moonhalo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#e8ecf8" stop-opacity=".25"/>
      <stop offset="1" stop-color="#e8ecf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fly" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fffbe0"/>
      <stop offset=".3" stop-color="#f6e7a1" stop-opacity=".9"/>
      <stop offset="1" stop-color="#f6e7a1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="400" height="176" fill="url(#sky)"/>
  <g fill="#e6e9f2" opacity=".6">
    <circle cx="30" cy="22" r=".8"/><circle cx="150" cy="16" r="1"/><circle cx="196" cy="44" r=".7"/><circle cx="240" cy="20" r=".9"/>
    <circle cx="372" cy="30" r="1"/><circle cx="352" cy="84" r=".6"/><circle cx="54" cy="96" r=".6"/><circle cx="124" cy="70" r=".7"/>
    <circle cx="270" cy="70" r=".6"/><circle cx="388" cy="110" r=".6"/>
  </g>
  <circle cx="88" cy="52" r="30" fill="url(#moonhalo)"/>
  <circle cx="88" cy="52" r="9" fill="#f1f3f8"/>
  <ellipse cx="200" cy="176" rx="220" ry="34" fill="url(#glow)"/>

  <path d="M0 176 Q36 166 76 171 Q112 166 150 176 Z" fill="#101a38"/>
  <rect y="176" width="400" height="74" fill="url(#sea)"/>
  <g stroke="#f1f3f8" stroke-linecap="round">
    <path d="M80 182 h16" stroke-opacity=".5"/><path d="M76 189 h24" stroke-opacity=".35"/>
    <path d="M82 196 h12" stroke-opacity=".28"/><path d="M74 203 h28" stroke-opacity=".18"/>
    <path d="M220 186 h30 M300 192 h22 M160 194 h18" stroke-opacity=".08"/>
  </g>

  <!-- power lines -->
  <g fill="none" stroke="#060912" stroke-width="1.1">
    <path d="M281 40 Q140 88 -10 60"/>
    <path d="M293 40 Q150 98 -10 78"/>
    <path d="M285 63 Q150 114 -10 100"/>
    <path d="M325 40 Q370 54 410 50"/>
    <path d="M313 40 Q362 62 410 64"/>
  </g>
  <!-- pole -->
  <g fill="#060912">
    <rect x="301" y="22" width="6" height="200"/>
    <rect x="276" y="44" width="56" height="4" rx="1"/>
    <rect x="282" y="62" width="44" height="3.5" rx="1"/>
    <rect x="279.5" y="37" width="3" height="7"/><rect x="291.5" y="37" width="3" height="7"/>
    <rect x="311.5" y="37" width="3" height="7"/><rect x="323.5" y="37" width="3" height="7"/>
    <rect x="283.5" y="57" width="3" height="5"/>
    <rect x="308" y="92" width="12" height="22" rx="3"/>
  </g>

  <!-- embankment -->
  <path fill="#060912" d="M0 250 V214 Q120 205 220 209 Q320 213 400 199 V250 Z"/>
  <path fill="#060912" d="M18 214 l2 -7 l2 7 z M62 210 l2 -6 l2 6 z M96 208 l1.5 -6 l2 6 z M236 210 l2 -7 l2 7 z M268 211 l2 -6 l2 6 z M350 206 l2 -7 l2 7 z M380 202 l2 -6 l2 6 z"/>
  <g fill="#060912">
    <circle cx="150" cy="195" r="3.3"/>
    <path d="M146.4 198.5 Q150 197.4 153.6 198.5 L155 207.6 L145.6 207.6 Z"/>
    <path d="M153 204 L160 201.5 L161 207.6 L153 207.6 Z"/>
  </g>

  <!-- fireflies -->
  <g>
    <circle class="ff" cx="120" cy="196" r="5" fill="url(#fly)"/>
    <circle class="ff" cx="186" cy="188" r="4" fill="url(#fly)"/>
    <circle class="ff" cx="226" cy="200" r="4.5" fill="url(#fly)"/>
    <circle class="ff" cx="70" cy="200" r="3.5" fill="url(#fly)"/>
    <circle class="ff" cx="260" cy="186" r="3.5" fill="url(#fly)"/>
    <circle class="ff" cx="340" cy="190" r="4" fill="url(#fly)"/>
  </g>
</svg>
