<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="800" height="500">
  <title>A tiny neural network predicting whether Liwu is researching or gaming</title>
  <style>
    text{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
    .hot{stroke-dasharray:4 10;animation:dash 1.4s linear infinite}
    .hot:nth-child(2){animation-duration:1.9s}
    .hot:nth-child(3){animation-duration:2.3s}
    @keyframes dash{to{stroke-dashoffset:-28}}
    .cur{animation:blink 1s steps(2,start) infinite}
    @keyframes blink{to{visibility:hidden}}
    @media (prefers-reduced-motion:reduce){.hot,.cur{animation:none}}
  </style>
  <defs>
