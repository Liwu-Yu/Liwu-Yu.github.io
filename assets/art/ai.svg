    <linearGradient id="bgl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#181825"/><stop offset="1" stop-color="#11111b"/></linearGradient>
  </defs>
  <rect width="400" height="250" fill="url(#bgl)"/>
  <rect width="400" height="250" fill="url(#grid)"/>
  <text x="14" y="30" font-size="9.5" fill="#9399b2"><tspan fill="#89b4fa">&gt;</tspan> model.predict(<tspan fill="#cdd6f4">"liwu is probably"</tspan>)</text>
