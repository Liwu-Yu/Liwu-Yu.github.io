<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="800" height="500">
  <title>A spinning record beside the chord progression IV, V, iii, vi and a small spectrum analyzer</title>
  <style>
    text{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
    .spin{animation:spin 6s linear infinite;transform-origin:118px 125px}
    @keyframes spin{to{transform:rotate(360deg)}}
    .spec rect{transform-box:fill-box;transform-origin:50% 100%;animation:eq 1.2s ease-in-out infinite alternate}
    @keyframes eq{from{transform:scaleY(1)}to{transform:scaleY(.35)}}
    @media (prefers-reduced-motion:reduce){.spin,.spec rect{animation:none}}
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#181825"/><stop offset="1" stop-color="#11111b"/></linearGradient>
    <linearGradient id="label" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#89b4fa"/><stop offset="1" stop-color="#fab387"/></linearGradient>
    <linearGradient id="bars" gradientUnits="userSpaceOnUse" x1="0" y1="110" x2="0" y2="196"><stop offset="0" stop-color="#fab387"/><stop offset="1" stop-color="#89b4fa"/></linearGradient>
  </defs>
  <rect width="400" height="250" fill="url(#bg)"/>
  <circle cx="118" cy="125" r="86" fill="#11111b" stroke="#cdd6f4" stroke-opacity=".14"/>
  <g fill="none" stroke="#cdd6f4" stroke-opacity=".06"><circle cx="118" cy="125" r="36"/><circle cx="118" cy="125" r="40"/><circle cx="118" cy="125" r="44"/><circle cx="118" cy="125" r="48"/><circle cx="118" cy="125" r="52"/><circle cx="118" cy="125" r="56"/><circle cx="118" cy="125" r="60"/><circle cx="118" cy="125" r="64"/><circle cx="118" cy="125" r="68"/><circle cx="118" cy="125" r="72"/><circle cx="118" cy="125" r="76"/><circle cx="118" cy="125" r="80"/></g>
  <g class="spin">
    <path d="M118 125 L118 39 A86 86 0 0 1 178 64 Z" fill="#fff" fill-opacity=".022"/>
    <circle cx="118" cy="125" r="28" fill="url(#label)" fill-opacity=".9"/>
    <circle cx="118" cy="104" r="2" fill="#11111b" fill-opacity=".5"/>
  </g>
  <circle cx="118" cy="125" r="3" fill="#11111b"/>
  <path d="M212 30 L180 96" stroke="#cdd6f4" stroke-opacity=".55" stroke-width="3" stroke-linecap="round"/>
  <rect x="173" y="92" width="10" height="7" rx="2" fill="#cdd6f4" fill-opacity=".7" transform="rotate(-26 178 95)"/>
  <circle cx="212" cy="30" r="7" fill="#181825" stroke="#cdd6f4" stroke-opacity=".45"/>

  <text x="236" y="58" font-size="8.5" letter-spacing="1.2" fill="#6c7086">ROYAL ROAD PROGRESSION</text>
  <g font-size="17" fill="#cdd6f4">
    <text x="236" y="86">IV</text><text x="278" y="86">V</text><text x="310" y="86">iii</text><text x="362" y="86">vi</text>
  </g>
  <g font-size="13" fill="#6c7086">
    <text x="261" y="85">→</text><text x="293" y="85">→</text><text x="345" y="85">→</text>
  </g>
  <g class="spec" fill="url(#bars)" fill-opacity=".85"><rect x="236.0" y="171" width="7" height="25" rx="1.5" style="animation-delay:-0.91s;animation-duration:1.5s"/><rect x="246.6" y="174" width="7" height="22" rx="1.5" style="animation-delay:-0.12s;animation-duration:1.3s"/><rect x="257.2" y="157" width="7" height="39" rx="1.5" style="animation-delay:-1.09s;animation-duration:1.5s"/><rect x="267.8" y="113" width="7" height="83" rx="1.5" style="animation-delay:-0.62s;animation-duration:0.9s"/><rect x="278.4" y="134" width="7" height="62" rx="1.5" style="animation-delay:-0.53s;animation-duration:0.9s"/><rect x="289.0" y="139" width="7" height="57" rx="1.5" style="animation-delay:-0.72s;animation-duration:0.9s"/><rect x="299.6" y="150" width="7" height="46" rx="1.5" style="animation-delay:-1.12s;animation-duration:1.1s"/><rect x="310.2" y="150" width="7" height="46" rx="1.5" style="animation-delay:-0.57s;animation-duration:1.1s"/><rect x="320.8" y="120" width="7" height="76" rx="1.5" style="animation-delay:-0.59s;animation-duration:0.9s"/><rect x="331.4" y="147" width="7" height="49" rx="1.5" style="animation-delay:-1.13s;animation-duration:1.5s"/><rect x="342.0" y="156" width="7" height="40" rx="1.5" style="animation-delay:-0.63s;animation-duration:1.3s"/><rect x="352.6" y="151" width="7" height="45" rx="1.5" style="animation-delay:-0.64s;animation-duration:1.5s"/><rect x="363.2" y="133" width="7" height="63" rx="1.5" style="animation-delay:-0.32s;animation-duration:1.3s"/><rect x="373.8" y="132" width="7" height="64" rx="1.5" style="animation-delay:-0.86s;animation-duration:1.3s"/></g>
  <path d="M236 196.5 H384" stroke="#cdd6f4" stroke-opacity=".14"/>
  <text x="236" y="218" font-size="9" fill="#6c7086">♩ = 180</text>
  <text x="384" y="218" font-size="9" fill="#fab387" text-anchor="end">last chorus: key +1</text>
</svg>
