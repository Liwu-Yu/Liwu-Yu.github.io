<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 400 250" width="800" height="500">
  <title>The Knight from Hollow Knight, nail in hand, standing under a shaft of light in a rainy underground city</title>
  <style>
    .f{animation:float 6s ease-in-out infinite}
    .f:nth-of-type(2n){animation-duration:7.5s;animation-delay:-2s}
    .f:nth-of-type(3n){animation-duration:5.2s;animation-delay:-3.4s}
    @keyframes float{0%,100%{transform:translate(0,0)}33%{transform:translate(5px,-7px)}66%{transform:translate(-4px,-3px)}}
    .lamp{animation:lamp 4s ease-in-out infinite}
    @keyframes lamp{0%,100%{opacity:.85}50%{opacity:.6}}
    .knight{animation:breathe 3.6s ease-in-out infinite;transform-origin:232px 202px}
    @keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.012,.985)}}
    @media (prefers-reduced-motion:reduce){.f,.lamp,.knight{animation:none}}
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#03050c"/>
      <stop offset=".55" stop-color="#0b1730"/>
      <stop offset="1" stop-color="#14294d"/>
    </linearGradient>
    <linearGradient id="shaft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfe9ff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#cfe9ff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="lum" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff"/>
      <stop offset=".22" stop-color="#d4f4ff"/>
      <stop offset=".55" stop-color="#7cc8ff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#7cc8ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#bfe6ff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#bfe6ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mask" x1=".8" y1="0" x2=".2" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".6" stop-color="#eef1f7"/>
      <stop offset="1" stop-color="#cdd4e3"/>
    </linearGradient>
    <linearGradient id="cloak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#11162a"/>
      <stop offset=".55" stop-color="#1b2236"/>
      <stop offset="1" stop-color="#2a3350"/>
    </linearGradient>
    <radialGradient id="shadow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#000" stop-opacity=".75"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pool" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#cfe9ff" stop-opacity=".14"/>
      <stop offset="1" stop-color="#cfe9ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="rain" width="48" height="64" patternUnits="userSpaceOnUse">
      <g stroke="#a8ccff" stroke-width=".8" stroke-linecap="round">
        <path d="M6 2 l-2 12" stroke-opacity=".35"/><path d="M30 18 l-2 12" stroke-opacity=".25"/>
        <path d="M18 40 l-2 12" stroke-opacity=".3"/><path d="M42 50 l-2 10" stroke-opacity=".2"/>
      </g>
      <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="0 64" dur=".7s" repeatCount="indefinite"/>
    </pattern>
  </defs>

  <rect width="400" height="250" fill="url(#bg)"/>
  <!-- distant spires -->
  <g fill="#132650" opacity=".8">
    <path d="M18 250 V128 L26 104 L34 128 V250 Z"/>
    <path d="M44 250 V150 Q52 136 60 150 V250 Z"/>
    <path d="M300 250 V112 L309 82 L318 112 V250 Z"/>
    <path d="M326 250 V138 Q336 122 346 138 V250 Z"/>
    <path d="M352 250 V96 L360 70 L368 96 V250 Z"/>
    <path d="M372 250 V150 L380 132 L388 150 V250 Z"/>
    <path d="M140 250 V160 L150 140 L160 160 V250 Z"/>
  </g>
  <g fill="#0d1b3b">
    <path d="M60 250 V140 L72 112 L84 140 V250 Z"/>
    <path d="M86 250 V170 Q96 156 106 170 V250 Z"/>
    <path d="M270 250 V150 L280 126 L290 150 V250 Z"/>
    <path d="M336 250 V164 Q348 150 360 164 V250 Z"/>
  </g>
  <g fill="#0f1f43" opacity=".9">
    <rect x="66" y="150" width="3" height="10" rx="1.5" fill="#ffd98a" opacity=".5"/>
    <rect x="76" y="160" width="3" height="10" rx="1.5" fill="#ffd98a" opacity=".35"/>
    <rect x="304" y="122" width="3" height="9" rx="1.5" fill="#9fd6ff" opacity=".45"/>
    <rect x="357" y="110" width="3" height="9" rx="1.5" fill="#9fd6ff" opacity=".4"/>
  </g>

  <path d="M262 0 H318 L262 200 H196 Z" fill="url(#shaft)"/>
  <rect width="400" height="250" fill="url(#rain)" opacity=".6"/>

  <!-- ceiling -->
  <path fill="#03050b" d="M0 0 H400 V16 L390 28 L380 14 L366 38 L352 16 L338 24 L326 12 L314 30 L300 10 L286 20 L262 8 L238 14 L222 6 L196 16 L170 8 L150 22 L136 10 L118 34 L104 14 L90 22 L74 10 L58 30 L44 12 L30 22 L16 10 L0 26 Z"/>

  <!-- lantern -->
  <path d="M98 14 V64" stroke="#0a1224" stroke-width="1.5"/>
  <circle class="lamp" cx="98" cy="76" r="30" fill="url(#halo)"/>
  <path d="M90 64 h16 l-2 4 v14 l2 4 h-16 l2 -4 v-14 z" fill="#0a1224" stroke="#2b3e66" stroke-width="1"/>
  <circle class="lamp" cx="98" cy="75" r="4.5" fill="#e9f8ff"/>

  <!-- ground -->
  <path fill="#03050b" d="M0 250 V208 Q40 200 90 204 L140 202 Q170 198 200 200 Q240 198 270 203 L320 201 Q360 205 400 199 V250 Z"/>
  <g fill="#03050b">
    <path d="M70 205 l3 -7 l2 6 z M118 203 l2 -6 l3 6 z M300 202 l2 -8 l3 7 z M350 203 l3 -6 l2 6 z M168 200 l2 -5 l2 5 z"/>
  </g>

  <ellipse cx="232" cy="203" rx="52" ry="7" fill="url(#pool)"/>

  <!-- knight -->
  <g class="knight">
    <g transform="translate(232 202) scale(.88)">
      <ellipse cx="3" cy="0" rx="26" ry="3.6" fill="url(#shadow)"/>
      <!-- legs -->
      <rect x="-7" y="-12" width="4.6" height="12" rx="2.2" fill="#06070c"/>
      <rect x="2.4" y="-12" width="4.6" height="12" rx="2.2" fill="#06070c"/>
      <!-- nail -->
      <path d="M13.9 -24.4 L16.1 -26.4 L35.4 -5.4 L35 -2.4 L32.8 -3.4 Z" fill="#c3cbdd"/>
      <path d="M16.1 -26.4 L35.4 -5.4" stroke="#eef2fa" stroke-width=".7"/>
      <path d="M12.6 -23 L17.4 -27.8" stroke="#8a93ab" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M10.6 -30.4 L15 -25.4" stroke="#2c3247" stroke-width="2.8" stroke-linecap="round"/>
      <!-- cloak -->
      <path d="M-9 -50 C-12.5 -41 -16.5 -27 -18 -11.5 L-14.6 -13.2 L-12.2 -8.6 L-7.6 -12.4 L-3.4 -8 L1.2 -11.8 L5.8 -7.6 L10.4 -11.6 L13.8 -8.4 L18.2 -11.4 C16.4 -27 12.6 -41 9 -50 Z" fill="url(#cloak)"/>
      <path d="M-4 -44 C-6 -34 -8 -24 -7.6 -12.4 M4.5 -44 C6 -34 6.5 -22 5.8 -7.6" stroke="#0b0e18" stroke-width="1.1" stroke-opacity=".7"/>
      <path d="M9 -50 C12.6 -41 16.4 -27 18.2 -11.4" stroke="#56689a" stroke-width="1" stroke-opacity=".75"/>
      <circle cx="13.2" cy="-27.6" r="2.7" fill="#232a42"/>
      <ellipse cx="0" cy="-46.5" rx="11" ry="2.6" fill="#000" opacity=".35"/>
      <!-- mask -->
      <path d="M0 -45.5 C-10.5 -46 -16.5 -53.5 -16.5 -63.5 C-16.5 -70 -15.5 -74.5 -13.4 -77.6 C-15.2 -86 -14.9 -96 -12.8 -106 C-10.6 -97.5 -7.9 -89 -6.6 -79.4 Q0 -81.8 6.6 -79.4 C7.9 -89 10.6 -97.5 12.8 -106 C14.9 -96 15.2 -86 13.4 -77.6 C15.5 -74.5 16.5 -70 16.5 -63.5 C16.5 -53.5 10.5 -46 0 -45.5 Z" fill="url(#mask)"/>
      <ellipse cx="-6.4" cy="-60" rx="4.7" ry="6.8" fill="#05060a"/>
      <ellipse cx="6.4" cy="-60" rx="4.7" ry="6.8" fill="#05060a"/>
    </g>
  </g>

  <!-- glowbugs -->
  <g>
    <circle class="f" cx="152" cy="118" r="7" fill="url(#lum)"/>
    <circle class="f" cx="178" cy="86" r="5.5" fill="url(#lum)"/>
    <circle class="f" cx="276" cy="128" r="6.5" fill="url(#lum)"/>
    <circle class="f" cx="304" cy="92" r="5" fill="url(#lum)"/>
    <circle class="f" cx="124" cy="164" r="5" fill="url(#lum)"/>
    <circle class="f" cx="336" cy="156" r="6" fill="url(#lum)"/>
    <circle class="f" cx="250" cy="66" r="4.5" fill="url(#lum)"/>
    <circle class="f" cx="204" cy="140" r="5" fill="url(#lum)"/>
    <circle class="f" cx="40" cy="176" r="4.5" fill="url(#lum)"/>
  </g>
</svg>
